[project]
name = "send-to-kindle"
version = "0.1.0"
description = "FastAPI app that converts files and sends them to Send-to-Kindle via Gmail"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "pydantic-settings",
    "aiosmtplib",
    "sqlmodel",
    "aiosqlite",
    "greenlet",
    "ebooklib",
    "pymupdf",
    "puremagic",
    "httpx",
    "python-slugify",
    "zlibrary",
    "playwright>=1.64.0",
    "curl-cffi>=0.16.3",
    "beautifulsoup4>=4.15.0",
    "lxml",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "aiosmtpd",
    "types-python-slugify",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101", "B008", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
